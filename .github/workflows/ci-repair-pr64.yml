name: PR 64 review repair

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/ci-repair-pr64.yml', '.github/scripts/pr64-review.py', '.github/scripts/pr64-locales.ts', '.github/scripts/pr64-fixtures/**']

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'reactnativecn/pushy-admin' && github.event.pull_request.number == 64 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/insights-metric-contract-20260927'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Apply exact reviewed edits and consolidate locale catalogs
        run: |
          python3 .github/scripts/pr64-review.py
          bun .github/scripts/pr64-locales.ts
          # Fixtures have now moved into their real source test locations.
          rm -r .github/scripts/pr64-fixtures
      - name: Format only edited source and test files
        run: |
          bunx --no-install biome check --write \
            src/constants/i18n-keys.ts src/constants/metric-thresholds.ts \
            src/pages/admin-service-status/version-health-overview-panel.tsx \
            src/i18n/resources.ts src/i18n/canonical-resources.test.ts \
            src/i18n/locales/en.json src/i18n/locales/zh-CN.json \
            src/pages/app-insights/logic.ts src/pages/app-insights/logic.test.ts \
            src/pages/app-insights/shared.tsx src/pages/app-insights/observation-ui.tsx \
            src/pages/app-insights/observation-ui.test.tsx \
            src/pages/app-insights/overview-panel.tsx src/pages/app-insights/versions-panel.tsx \
            src/pages/app-insights/traffic-panel.tsx src/pages/app-insights/failures-panel.tsx \
            src/pages/app-insights/review-regressions.test.ts src/pages/app-insights/review-availability.test.tsx
          git diff --check
      - name: All repository type, lint and test gates
        run: bun run ci
      - name: Production build and bundle size
        run: bun run build:check
        env:
          CI: 'true'
      - name: Push only verified changes to the same PR branch
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/insights-metric-contract-20260927
          actual=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git add -A -- \
            src/constants/i18n-keys.ts src/constants/metric-thresholds.ts \
            src/pages/admin-service-status/version-health-overview-panel.tsx \
            src/i18n/resources.ts src/i18n/canonical-resources.test.ts src/i18n/insights-metrics.ts \
            src/i18n/locales/en.json src/i18n/locales/zh-CN.json \
            src/pages/app-insights/logic.ts src/pages/app-insights/logic.test.ts \
            src/pages/app-insights/shared.tsx src/pages/app-insights/observation-ui.tsx \
            src/pages/app-insights/observation-ui.test.tsx \
            src/pages/app-insights/overview-panel.tsx src/pages/app-insights/versions-panel.tsx \
            src/pages/app-insights/traffic-panel.tsx src/pages/app-insights/failures-panel.tsx \
            src/pages/app-insights/review-regressions.test.ts src/pages/app-insights/review-availability.test.tsx
          git diff --cached --stat
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git commit -m 'fix(insights): align available populations, canonicalize labels and share thresholds'
          git push origin "HEAD:refs/heads/$branch"
      - name: Export diagnostics on failure
        if: failure()
        run: git diff > review-repair.patch
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: pr64-review-diagnostics
          retention-days: 3
          path: |
            review-repair.patch
            src/pages/app-insights
            src/i18n
            src/constants/metric-thresholds.ts
